services:
  - type: web
    name: fintrack-backend
    runtime: node
    plan: free
    rootDir: fin-track-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        value: http://localhost:4200
      - key: CLIENT_PROD
        sync: false
